services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: printfarm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-printfarm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-printfarm_dev}
      POSTGRES_DB: ${DB_NAME:-printfarm_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-printfarm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional, for future real-time features)
  redis:
    image: redis:7-alpine
    container_name: printfarm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printfarm_app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-printfarm}:${DB_PASSWORD:-printfarm_dev}@db:5432/${DB_NAME:-printfarm_dev}
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3000}
      NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
